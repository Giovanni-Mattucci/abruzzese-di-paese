name: E2E

on:
  pull_request:
    paths: [apps/**, packages/**, pnpm-lock.yaml, .github/workflows/e2e.yml]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # WebKit runs on main only; install exactly the browsers this run uses.
      E2E_WEBKIT: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
      PLAYWRIGHT_BROWSERS: ${{ github.ref == 'refs/heads/main' && 'chromium webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_BROWSERS }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @adp/web exec playwright install --with-deps ${{ env.PLAYWRIGHT_BROWSERS }}
      - run: pnpm data:build
      - run: pnpm --filter @adp/web build
      # Visual snapshots run on Linux only. Missing baselines are written and uploaded below;
      # commit them once (see CONTRIBUTING.md), after which every run compares against them.
      - run: pnpm --filter @adp/web e2e --update-snapshots=missing
        env:
          E2E_VISUAL: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

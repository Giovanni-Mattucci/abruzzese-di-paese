packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - i18next@27.0.1
  - react-i18next@18.0.0

# GHSA-g3hv-75wg-m249: typescript-eslint 8.72 still asks for minimatch ^10, which is vulnerable.
# Remove once @typescript-eslint/typescript-estree depends on minimatch 11.0.1 or later.
overrides:
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
